# 📊 GitHub Metrics — kevinvinn
# Fixed: semua metrics dalam 2 job berurutan untuk menghindari git push conflict

name: GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:

  # ═══════════════════════════════════════════
  # JOB 1: Metrics utama (header, isocalendar, languages, lines)
  # ═══════════════════════════════════════════
  github-metrics-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --- Header & Base Stats ---
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: header, activity, community, repositories, metadata
          filename: metrics-header.svg
          config_timezone: Asia/Jakarta

      # --- Isometric Calendar ---
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: ""
          filename: metrics-isocalendar.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Jakarta

      # --- Languages ---
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: ""
          filename: metrics-languages.svg
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          config_timezone: Asia/Jakarta

      # --- Lines of Code ---
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: repositories
          filename: metrics-lines.svg
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          config_timezone: Asia/Jakarta

  # ═══════════════════════════════════════════
  # JOB 2: Metrics lanjutan (habits, achievements)
  # Menunggu JOB 1 selesai agar tidak ada git conflict
  # ═══════════════════════════════════════════
  github-metrics-extra:
    runs-on: ubuntu-latest
    needs: github-metrics-main
    permissions:
      contents: write
    steps:
      # --- Coding Habits ---
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: ""
          filename: metrics-habits.svg
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%
          config_timezone: Asia/Jakarta

      # --- Achievements ---
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: ""
          filename: metrics-achievements.svg
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          config_timezone: Asia/Jakarta

  # ═══════════════════════════════════════════
  # JOB 3: Snake Contribution Animation
  # ═══════════════════════════════════════════
  github-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kevinvinn
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
