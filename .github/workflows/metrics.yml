# 📊 GitHub Metrics — kevinvinn
# Workflow ini berjalan otomatis setiap 6 jam dan bisa di-trigger manual

name: GitHub Metrics

on:
  # Jalankan otomatis setiap 6 jam
  schedule:
    - cron: "0 */6 * * *"
  # Bisa di-trigger manual dari tab Actions
  workflow_dispatch:
  # Jalankan saat push ke main
  push:
    branches: [main]

jobs:

  # ═══════════════════════════════════════════
  # 📊 METRICS - Header & Base Stats
  # ═══════════════════════════════════════════
  github-metrics-header:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: header, activity, community, repositories, metadata
          filename: metrics-header.svg
          config_timezone: Asia/Jakarta

  # ═══════════════════════════════════════════
  # 📅 ISOMETRIC COMMIT CALENDAR
  # ═══════════════════════════════════════════
  github-metrics-isocalendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: ""
          filename: metrics-isocalendar.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Jakarta

  # ═══════════════════════════════════════════
  # 🈷️ MOST USED LANGUAGES
  # ═══════════════════════════════════════════
  github-metrics-languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: ""
          filename: metrics-languages.svg
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          config_timezone: Asia/Jakarta

  # ═══════════════════════════════════════════
  # 👨‍💻 LINES OF CODE CHANGED
  # ═══════════════════════════════════════════
  github-metrics-lines:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: repositories
          filename: metrics-lines.svg
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          config_timezone: Asia/Jakarta

  # ═══════════════════════════════════════════
  # 💡 CODING HABITS & ACTIVITY
  # ═══════════════════════════════════════════
  github-metrics-habits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: ""
          filename: metrics-habits.svg
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%
          config_timezone: Asia/Jakarta

  # ═══════════════════════════════════════════
  # 🏆 ACHIEVEMENTS
  # ═══════════════════════════════════════════
  github-metrics-achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: ""
          filename: metrics-achievements.svg
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          config_timezone: Asia/Jakarta

  # ═══════════════════════════════════════════
  # 📌 STARRED TOPICS
  # ═══════════════════════════════════════════
  github-metrics-topics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: ""
          filename: metrics-topics.svg
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
          config_timezone: Asia/Jakarta

  # ═══════════════════════════════════════════
  # ⏱️ WAKATIME (hapus job ini jika tidak pakai WakaTime)
  # ═══════════════════════════════════════════
  github-metrics-wakatime:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kevinvinn
          template: classic
          base: ""
          filename: metrics-wakatime.svg
          plugin_wakatime: yes
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          config_timezone: Asia/Jakarta

  # ═══════════════════════════════════════════
  # 🐍 SNAKE CONTRIBUTION ANIMATION
  # ═══════════════════════════════════════════
  github-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kevinvinn
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push snake SVG ke branch output
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
